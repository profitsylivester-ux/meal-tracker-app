name: Build Nourish AI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile-apk/**"
      - ".github/workflows/build-nourish-ai-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile-apk/package.json

      - name: Install Capacitor
        working-directory: mobile-apk
        run: npm install

      - name: Generate Android project
        working-directory: mobile-apk
        run: npx cap add android

      - name: Sync Android project
        working-directory: mobile-apk
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile-apk/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nourish-ai-android-apk
          path: mobile-apk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
